<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 24 24%22%3E%3Crect width=%2224%22 height=%2224%22 rx=%225%22 fill=%22%2323252A%22/%3E%3Cpath d=%22M6 18v-6M10 18V7M14 18v-4M18 18v-8%22 stroke=%22white%22 stroke-width=%222.4%22 stroke-linecap=%22round%22/%3E%3C/svg%3E">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="/web.js"></script>
<title>My Day</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: warm canvas sidebar + floating white work window (Sunsama-like); planner = day columns + calendar panel; colour only where action is needed */
:root{
  color-scheme:light;
  --canvas:#F6F5F2; --surface:#FFFFFF; --surface-2:#F2F1ED; --surface-3:#EAE8E3; --line:#E5E3DE; --line-2:#D9D6D0;
  --fg:#23252A; --muted:#6B6D73; --faint:#9A9BA0;
  --ink-btn:#23252A; --ink-btn-fg:#FFFFFF; --hl:#2E8A57; --brand:#8BC34A;
  --sh-1:0 1px 2px rgba(28,25,23,.06),0 1px 1px rgba(28,25,23,.03);
  --sh-2:0 2px 4px rgba(28,25,23,.04),0 6px 18px rgba(28,25,23,.07);
  --sh-3:0 12px 32px rgba(28,25,23,.12),0 2px 6px rgba(28,25,23,.06);
  --sh-4:0 28px 80px rgba(28,25,23,.22),0 4px 12px rgba(28,25,23,.08);
  --reply:#D93036; --reply-on:#FFFFFF; --reply-bg:#FCECEC; --reply-ink:#B4232A;
  --overdue:#E5590F; --overdue-on:#FFFFFF; --overdue-bg:#FDEEE3; --overdue-ink:#B9480B;
  --today:#F2B10A; --today-on:#1F1A0A; --today-bg:#FDF5DB; --today-ink:#875F00;
  --week:#2F5FD0; --week-on:#FFFFFF; --week-bg:#E8EEFC; --week-ink:#2A53B8;
  --auto:#6B7684; --auto-on:#FFFFFF; --auto-bg:#EEF0F2; --auto-ink:#56606C;
  --later:#2E8A57; --later-on:#FFFFFF; --later-bg:#E5F3EA; --later-ink:#24734A;
  --done:#2E8A57; --done-on:#FFFFFF; --done-bg:#E5F3EA; --done-ink:#24734A;
  --font:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r-sm:8px; --r:12px; --r-lg:16px;
}
:root[data-mode="dark"]{
  color-scheme:dark;
  --canvas:#141518; --surface:#1D1F23; --surface-2:#25272C; --surface-3:#2E3036; --line:#30333A; --line-2:#3B3E46;
  --fg:#ECEDEF; --muted:#A3A6AD; --faint:#7D8088;
  --ink-btn:#ECEDEF; --ink-btn-fg:#141518; --hl:#6FD39A;
  --sh-1:0 1px 2px rgba(0,0,0,.4); --sh-2:0 2px 10px rgba(0,0,0,.35); --sh-3:0 12px 32px rgba(0,0,0,.5); --sh-4:0 28px 80px rgba(0,0,0,.6);
  --reply:#EF4B50; --reply-bg:#3A2024; --reply-ink:#FF9396;
  --overdue:#F9772A; --overdue-on:#1A1A1A; --overdue-bg:#3A2A1C; --overdue-ink:#FFA770;
  --today:#FFC53D; --today-bg:#393118; --today-ink:#FFD66B;
  --week:#5B83F0; --week-bg:#1F2944; --week-ink:#93AEF8;
  --auto:#8A96A3; --auto-on:#111; --auto-bg:#2A2F36; --auto-ink:#B3BCC6;
  --later:#3DB06F; --later-on:#0F1712; --later-bg:#1B3226; --later-ink:#74D59E;
  --done:#3DB06F; --done-on:#0F1712; --done-bg:#1B3226; --done-ink:#74D59E;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--canvas);color:var(--fg);font-family:var(--font);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit}
:focus-visible{outline:2px solid var(--week);outline-offset:2px}
svg{flex:none}

/* shell */
.app{display:grid;grid-template-columns:236px minmax(0,1fr);min-height:100%;gap:0}
.side{padding:18px 12px;display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh;overflow:auto}
.brand{display:flex;align-items:center;gap:10px;padding:4px 10px 14px}
.brand .logo{width:30px;height:30px;border-radius:8px;background:var(--brand);display:grid;place-items:center;color:#163A26;box-shadow:var(--sh-1)}
.brand b{font-size:16px;font-weight:700;letter-spacing:-.01em}
.slabel{font-size:12px;font-weight:600;color:var(--faint);letter-spacing:.04em;padding:14px 10px 4px}
.sbtn{display:flex;align-items:center;gap:10px;width:100%;background:none;border:0;border-radius:8px;padding:7px 10px;font-size:14.5px;font-weight:500;color:var(--fg);text-align:left}
.sbtn svg{width:17px;height:17px;color:var(--muted)}
.sbtn:hover{background:var(--surface-3)}
.sbtn[aria-current="true"]{background:var(--surface);box-shadow:var(--sh-1);font-weight:600}
.sbtn[aria-current="true"] svg{color:var(--fg)}
.sbtn .ct{margin-left:auto;font-size:12.5px;font-weight:600;color:var(--muted);background:var(--surface-3);border-radius:99px;padding:0 7px}
.sbtn .ct.hot{background:var(--reply);color:#fff}
.goals{margin-top:auto;background:var(--surface);border-radius:var(--r);box-shadow:var(--sh-1);padding:12px;display:flex;flex-direction:column;gap:10px}
.goals h4{margin:0;font-size:13px;font-weight:600;color:var(--muted)}
.goal{display:flex;flex-direction:column;gap:4px;font-size:13.5px}
.goal div{display:flex;justify-content:space-between;gap:10px}
.goal b{font-weight:600}
.meter{height:5px;border-radius:99px;background:var(--surface-3);overflow:hidden}
.meter i{display:block;height:100%;background:var(--hl);border-radius:99px}
.me{display:flex;align-items:center;gap:10px;padding:10px 6px 2px}
.me i{width:30px;height:30px;border-radius:50%;background:var(--hl);color:#fff;font-style:normal;font-weight:600;font-size:12.5px;display:grid;place-items:center}
.me b{display:block;font-size:13.5px;font-weight:600;line-height:1.2}
.me span{font-size:12.5px;color:var(--muted)}
.me button{margin-left:auto;background:none;border:0;padding:6px;border-radius:7px;color:var(--muted)}
.me button:hover{background:var(--surface-3)}

.window{margin:10px 10px 10px 0;background:var(--surface);border-radius:var(--r-lg);box-shadow:var(--sh-2),0 0 0 1px var(--line);min-width:0;display:flex;flex-direction:column;min-height:calc(100vh - 20px)}
.wbar{display:flex;align-items:center;gap:10px;padding:12px 20px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.wbar h1{margin:0;font-size:15px;font-weight:600}
.wbar .sp{flex:1}
.tool{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:7px;padding:4px 10px;font-size:13.5px;font-weight:500;box-shadow:var(--sh-1);color:var(--fg);text-decoration:none}
.tool svg{width:15px;height:15px;color:var(--muted)}
.tool:hover{background:var(--surface-2)}
.tool.dark{background:var(--ink-btn);color:var(--ink-btn-fg);border-color:var(--ink-btn)}
.tool.dark svg{color:var(--ink-btn-fg)}
.wbody{padding:24px clamp(16px,3vw,32px) 48px;display:flex;flex-direction:column;gap:22px;min-width:0}

/* type scale */
.h-page{margin:0;font-size:28px;font-weight:700;letter-spacing:-.025em;line-height:1.15}
.h-page em{font-style:normal;color:var(--hl)}
.sub{color:var(--muted);font-size:14.5px;margin:4px 0 0}
.h-sec{margin:0;font-size:16px;font-weight:600}
.small{font-size:13px;color:var(--muted)}

/* today board */
.head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap}
.prog{background:var(--surface);border-radius:var(--r);box-shadow:var(--sh-1),0 0 0 1px var(--line);padding:12px 14px;min-width:min(240px,100%)}
.prog div{display:flex;justify-content:space-between;font-size:13.5px;font-weight:600}
.prog .meter{margin-top:8px;height:6px}
.note{display:flex;gap:10px;align-items:flex-start;border-radius:var(--r);padding:11px 14px;background:var(--week-bg);color:var(--fg);font-size:14px}
.note svg{width:18px;height:18px;color:var(--week);margin-top:1px}
.note b{font-weight:600;color:var(--week-ink)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(160px,100%),1fr));gap:10px}
.stat{display:flex;align-items:center;gap:10px;background:var(--surface);border-radius:var(--r);box-shadow:var(--sh-1),0 0 0 1px var(--line);padding:12px 14px;text-decoration:none;font-size:14px;font-weight:500;white-space:nowrap}
.stat .ic{width:28px;height:28px;border-radius:8px;background:var(--c);color:var(--c-on);display:grid;place-items:center}
.stat .ic svg{width:15px;height:15px}
.stat b{margin-left:auto;font-size:22px;font-weight:700;letter-spacing:-.02em}
.stat:hover{box-shadow:var(--sh-2),0 0 0 1px var(--c)}
.lane{display:flex;flex-direction:column;gap:12px}
.lh{display:flex;align-items:center;gap:12px;padding-bottom:10px;border-bottom:1px solid var(--line);background:none;border-top:0;border-left:0;border-right:0;width:100%;text-align:left}
.lh .ic{width:30px;height:30px;border-radius:9px;background:var(--c);color:var(--c-on);display:grid;place-items:center}
.lh .ic svg{width:16px;height:16px}
.lh h2{margin:0;font-size:16.5px;font-weight:600}
.lh p{margin:0;font-size:13.5px;color:var(--muted)}
.lh .n{margin-left:auto;background:var(--c-bg);color:var(--c-ink);font-weight:700;font-size:13px;border-radius:99px;padding:2px 10px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(330px,100%),1fr));gap:14px}
.card{background:var(--surface);border-radius:var(--r);box-shadow:var(--sh-2),0 0 0 1px color-mix(in srgb,var(--c) 25%,var(--line));overflow:visible;display:flex;flex-direction:column}
.card.focus{box-shadow:var(--sh-3),0 0 0 2px var(--c)}
.band{background:var(--c);color:var(--c-on);padding:11px 14px;display:flex;gap:10px;align-items:flex-start}
.band svg{width:17px;height:17px;margin-top:2px}
.band b{display:block;font-size:15.5px;font-weight:600;line-height:1.3}
.band small{display:block;font-size:13.5px;opacity:.92;margin-top:2px}
.band small strong{font-weight:600}
.band .start{display:inline-block;font-size:11.5px;font-weight:700;background:var(--c-on);color:var(--c);border-radius:5px;padding:0 6px;margin-right:6px;vertical-align:1px}
.cbody{padding:13px 14px 12px;display:flex;flex-direction:column;gap:10px;background:color-mix(in srgb,var(--c-bg) 70%,var(--surface))}
.who{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.who button{background:none;border:0;padding:0;font-size:17px;font-weight:700;letter-spacing:-.01em;text-align:left;color:var(--fg)}
.who button:hover{text-decoration:underline;text-underline-offset:3px}
.who span{font-size:13.5px;color:var(--muted)}
.pills{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:13px;font-weight:600;border-radius:6px;padding:3px 8px;background:var(--surface);color:var(--fg);box-shadow:0 0 0 1px var(--line)}
.pill svg{width:14px;height:14px}
.pill.warn{background:var(--today);color:var(--today-on);box-shadow:none}
.pill.bad{background:var(--reply);color:#fff;box-shadow:none}
.pill.grace{background:transparent;box-shadow:none;color:var(--week-ink);padding-left:2px}
.pill.cold{background:var(--auto-bg);color:var(--auto-ink);box-shadow:none}
.acts{display:flex;gap:8px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:7px;border-radius:8px;padding:7px 12px;font-size:14px;font-weight:600;border:1px solid var(--line);background:var(--surface);color:var(--fg);box-shadow:var(--sh-1);text-decoration:none}
.btn svg{width:15px;height:15px}
.btn.primary{background:var(--ink-btn);color:var(--ink-btn-fg);border-color:var(--ink-btn)}
.btn.ghost{background:none;border-color:transparent;box-shadow:none;color:var(--muted)}
.btn:hover{filter:brightness(.97)}
.confirm{border-radius:10px;background:var(--surface);box-shadow:0 0 0 2px var(--c);padding:10px 12px;display:flex;flex-direction:column;gap:8px;font-size:14px}
.confirm b{font-weight:600}
.confirm small{color:var(--muted)}

/* planner */
.planner{display:flex;flex:1;min-height:0}.planner .days{flex:1;border-right:0}
.days{background:var(--canvas);display:grid;grid-auto-flow:column;grid-auto-columns:minmax(250px,1fr);gap:16px;padding:20px;overflow-x:auto;border-right:1px solid var(--line)}
.day{display:flex;flex-direction:column;gap:10px;min-width:0}
.dayh{display:flex;flex-direction:column;gap:2px;background:none;border:0;text-align:left;padding:0 2px}
.dayh b{font-size:21px;font-weight:700;letter-spacing:-.02em}
.dayh span{font-size:14px;color:var(--muted)}
.dayh.sel span{color:var(--hl);font-weight:600}
.load{height:5px;border-radius:99px;background:var(--surface-3);overflow:hidden;margin:6px 2px 2px}
.load i{display:block;height:100%;background:var(--hl)}
.load.over i{background:var(--overdue)}
.addtask{display:flex;align-items:center;gap:8px;background:var(--surface);border-radius:10px;box-shadow:var(--sh-1),0 0 0 1px var(--line);padding:8px 10px}
.addtask svg{width:15px;height:15px;color:var(--faint)}
.addtask input{flex:1;min-width:0;border:0;background:none;font-size:14px;outline:none}
.tot{font-size:12px;font-weight:600;background:var(--surface-2);border-radius:5px;padding:1px 6px;color:var(--muted)}
.drop{display:flex;flex-direction:column;gap:10px;min-height:80px;border-radius:12px;padding:2px}
.drop.over{background:color-mix(in srgb,var(--week) 8%,transparent);outline:2px dashed color-mix(in srgb,var(--week) 50%,transparent)}
.task{background:var(--surface);border-radius:10px;box-shadow:var(--sh-1),0 0 0 1px var(--line);padding:10px 12px;display:flex;flex-direction:column;gap:7px;cursor:grab}
.task:hover{box-shadow:var(--sh-2),0 0 0 1px var(--line-2)}
.task.dragging{opacity:.45}
.task.isdone{opacity:.55}
.task.isdone .tt{text-decoration:line-through}
.trow{display:flex;gap:8px;align-items:flex-start}
.tt{flex:1;font-size:14.5px;font-weight:500;line-height:1.35}
.tt small{display:block;font-size:13px;color:var(--muted);font-weight:400}
.est{font-size:12px;font-weight:600;background:var(--surface-2);border-radius:5px;padding:1px 6px;color:var(--muted);white-space:nowrap}
.tm{display:inline-block;font-size:12px;font-weight:700;border-radius:5px;padding:1px 6px;background:var(--c);color:var(--c-on);width:max-content}
.subs{display:flex;flex-direction:column;gap:3px;padding-left:2px}
.subs label{display:flex;gap:8px;align-items:center;font-size:14px;cursor:pointer}
.subs input{appearance:none;width:16px;height:16px;border:1.5px solid var(--line-2);border-radius:50%;margin:0;display:grid;place-items:center}
.subs input:checked{background:var(--hl);border-color:var(--hl)}
.subs input:checked+span{text-decoration:line-through;color:var(--muted)}
.tfoot{display:flex;align-items:center;gap:8px}
.chk{width:20px;height:20px;border-radius:50%;border:1.5px solid var(--line-2);background:none;display:grid;place-items:center;padding:0;color:transparent}
.chk svg{width:12px;height:12px}
.chk:hover{border-color:var(--hl);color:var(--hl)}
.task.isdone .chk{background:var(--hl);border-color:var(--hl);color:#fff}
.src{width:18px;height:18px;border-radius:5px;display:grid;place-items:center;color:var(--muted)}
.src svg{width:15px;height:15px}
.tag{margin-left:auto;font-size:13px;font-weight:500;color:var(--muted)}
.tag i{font-style:normal;font-weight:700;color:var(--tc)}
.focusbtn{background:none;border:0;padding:2px;color:var(--faint);border-radius:5px}
.focusbtn:hover{color:var(--fg);background:var(--surface-2)}
.focusbtn svg{width:15px;height:15px}

.cal{display:flex;flex-direction:column;min-width:0;background:var(--surface)}
.calh{display:flex;align-items:baseline;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line)}
.calh small{font-size:12px;font-weight:700;color:var(--muted);letter-spacing:.04em}
.calh b{font-size:22px;font-weight:700}
.calh span{font-size:13.5px;color:var(--muted);margin-left:auto}
.grid{position:relative;margin:8px 12px 20px 52px;--hh:52px}
.hr{height:var(--hh);border-top:1px solid var(--line);position:relative}
.hr span{position:absolute;left:-46px;top:-9px;font-size:12px;color:var(--faint);width:40px;text-align:right}
.blk{position:absolute;left:4px;right:4px;border-radius:7px;padding:5px 8px;font-size:13px;font-weight:600;overflow:hidden;box-shadow:var(--sh-1)}
.blk small{display:block;font-weight:500;opacity:.9;font-size:12px}
.blk.ev{background:#5BA7EE;color:#fff}
.blk.ev.amber{background:#F4A942;color:#2A1A00}
.blk.ev.violet{background:#9B7BF0;color:#fff}
.blk.task{background:var(--c-bg);color:var(--c-ink);box-shadow:inset 3px 0 0 var(--c);cursor:default}
.now{position:absolute;left:-6px;right:0;height:2px;background:var(--reply)}
.now:before{content:"";position:absolute;left:-4px;top:-4px;width:10px;height:10px;border-radius:50%;background:var(--reply)}
.slot.over{background:color-mix(in srgb,var(--week) 10%,transparent)}

/* tables */
.tablewrap{overflow-x:auto;background:var(--surface);border-radius:var(--r);box-shadow:var(--sh-1),0 0 0 1px var(--line)}
table{border-collapse:collapse;width:100%;min-width:900px;font-size:14px}
th{text-align:left;font-size:12.5px;font-weight:600;color:var(--muted);padding:10px 14px;border-bottom:1px solid var(--line);background:var(--surface-2)}
td{padding:10px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
tbody tr:hover td{background:var(--surface-2)}
td .lnk{background:none;border:0;padding:0;font-weight:600;text-align:left}
td .lnk:hover{text-decoration:underline}
td small{display:block;color:var(--muted);font-size:13px}
.search{display:flex;align-items:center;gap:10px;background:var(--surface);border-radius:var(--r);box-shadow:var(--sh-1),0 0 0 1px var(--line);padding:10px 14px}
.search svg{width:18px;height:18px;color:var(--faint)}
.search input{flex:1;border:0;outline:none;background:none;font-size:15.5px;min-width:0}
.pipebar{display:flex;overflow-x:auto;border-radius:var(--r);box-shadow:var(--sh-1)}
.chev{flex:1 0 auto;min-width:104px;height:56px;border:0;background:var(--pc);color:var(--pi);display:flex;flex-direction:column;justify-content:center;align-items:flex-start;padding:0 12px 0 24px;margin-left:-11px;clip-path:polygon(0 0,calc(100% - 12px) 0,100% 50%,calc(100% - 12px) 100%,0 100%,12px 50%)}
.chev:first-child{margin-left:0;padding-left:14px;clip-path:polygon(0 0,calc(100% - 12px) 0,100% 50%,calc(100% - 12px) 100%,0 100%)}
.chev b{font-size:19px;font-weight:700;line-height:1.1}
.chev span{font-size:12.5px;font-weight:600;white-space:nowrap}
.chev.dim{opacity:.32}
tr.grp td{background:var(--surface-2);font-weight:600;padding:8px 14px}
.gpill{display:inline-block;background:var(--pc);color:var(--pi);border-radius:6px;padding:1px 9px;font-size:13.5px}
.gn{margin-left:8px;color:var(--muted);font-size:13px}
tr.row td:first-child{box-shadow:inset 3px 0 0 var(--pc)}

/* email preview */
.mail{max-width:720px;background:var(--surface);border-radius:var(--r);box-shadow:var(--sh-2),0 0 0 1px var(--line);overflow:hidden}
.mh{padding:16px 20px;border-bottom:1px solid var(--line);font-size:13.5px;color:var(--muted);display:grid;gap:2px}
.mh b{color:var(--fg);font-weight:600}
.mh .subj{font-size:18px;font-weight:700;color:var(--fg);margin-top:6px}
.mb{padding:18px 20px;display:flex;flex-direction:column;gap:20px}
.mb h4{margin:0 0 8px;font-size:13px;font-weight:600;color:var(--muted)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(104px,100%),1fr));gap:8px}
.kpi{background:var(--surface-2);border-radius:10px;padding:10px 12px}
.kpi b{display:block;font-size:22px;font-weight:700;letter-spacing:-.02em}
.kpi span{font-size:13px;color:var(--muted)}
.ml{display:flex;gap:10px;align-items:baseline;padding:7px 0;border-bottom:1px solid var(--line);font-size:14px}

 const g=GRACE(),inGrace=g&&TODAY<g;
 const scored=clocks.map(c=>{const eff=inGrace&&c.date<g?g:c.date;return {...c,eff,left:diff(eff,TODAY),cliff:inGrace&&c.date<g}});

 const stamp=(d,h)=>d.replace(/-/g,"")+"T"+String(Math.floor(h)).padStart(2,"0")+String(Math.round((h%1)*60)).padStart(2,"0")+"00";
 const det=[a?`${a.company} (${a.cat||""})`:"",a?plan(a).sub:"",a?`ContactOut: ${coUrl(a)}`:"","Added from My Day"].filter(Boolean).join("\n");
 return `https://calendar.google.com/calendar/render?action=TEMPLATE${CFG.gmail?`&authuser=${encodeURIComponent(CFG.gmail)}`:""}&text=${encodeURIComponent(t.title)}&dates=${stamp(t.date,st)}/${stamp(t.date,en)}&ctz=${encodeURIComponent(Intl.DateTimeFormat().resolvedOptions().timeZone||"Europe/Warsaw")}&details=${encodeURIComponent(det)}`;

const Team={ids:[],names:{},rx:[],tx:[],ok:false,
 async start(){

  db.collection("team").onSnapshot(snap=>{this.ids=snap.docs.map(d=>d.id);this.resolve().then(()=>render(true))},()=>{});
  db.collection("handoffs").where("to","==",me).onSnapshot(snap=>{this.rx=snap.docs.map(d=>({id:d.id,...d.data()}));this.resolve().then(()=>{this.onRx();render(true)})},()=>{});
  db.collection("handoffs").where("from","==",me).onSnapshot(snap=>{this.tx=snap.docs.map(d=>({id:d.id,...d.data()}));this.resolve().then(()=>{this.onTx();render(true)})},()=>{});
 },
 async resolve(){
  if(!Store.user)return;const ids=[...new Set([...this.ids,...this.rx.map(h=>h.from),...this.tx.map(h=>h.to)])].filter(Boolean);if(!ids.length)return;

 snapshot(a){return {note:handNote(a),company:a.company,domain:a.domain||"",cat:a.cat||"",contact:a.contact||"",title:a.title||"",email:a.email||"",li:a.li||"",co:a.co||"",admin:a.admin||"",signal:a.signal||"",notes:a.notes||"",summary:handoffSummary(a),log:(a.log||[]).slice(-20),first:a.first||"",last:a.last||"",reply:a.reply||"",owned:a.owned||""}},

function parseCSV(text){
 const delim=(text.split("\n")[0].match(/\t/g)||[]).length>(text.split("\n")[0].match(/,/g)||[]).length?"\t":(text.split("\n")[0].match(/;/g)||[]).length>(text.split("\n")[0].match(/,/g)||[]).length?";":",";
 const rows=[];let row=[],cur="",q=false;
 for(let i=0;i<text.length;i++){const c=text[i];
  if(q){if(c==='"'){if(text[i+1]==='"'){cur+='"';i++}else q=false}else cur+=c}
  else if(c==='"')q=true;else if(c===delim){row.push(cur);cur=""}else if(c==="\n"||c==="\r"){if(c==="\r"&&text[i+1]==="\n")i++;row.push(cur);rows.push(row);row=[];cur=""}else cur+=c}
 if(cur||row.length){row.push(cur);rows.push(row)}

function parseDate(v){

 const s=String(v).trim();let m;
 if((m=s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/)))return S(new Date(+m[1],+m[2]-1,+m[3],12));
 if((m=s.match(/^(\d{1,2})[\/.](\d{1,2})[\/.](\d{2,4})$/))){let y=+m[3];if(y<100)y+=2000;let d=+m[1],mo=+m[2];if(mo>12&&d<=12)[d,mo]=[mo,d];return S(new Date(y,mo-1,d,12))}
 const t=Date.parse(s);if(!isNaN(t)){const d=new Date(t);if(!/\d{4}/.test(s))d.setFullYear(new Date().getFullYear());return S(d)}

}

const mbDate=x=>{if(!x)return "";const d=new Date(x);return isNaN(d)?"":S(d)};
const MB_WON=["closed","self-checkout","renewal"],MB_LOST=["deal_lost","not-interested"];
// Stage from the dashboard. Deal status stays with a company when it's transferred, so it only counts
// when you've been in touch since the account became yours; otherwise a paid company is an inherited customer.
function mbStage(a,{st,last,reply,meet,action,paid,amount,claimed}){
 const yours=!!last||!!reply||!!meet;
 if(MB_WON.includes(st)&&!!last){a.stage="Won";a.wonDate=paid&&paid>=claimed?paid:last;if(amount)a.value=amount;return}
 if(MB_WON.includes(st))a.paidBefore=1;
 if(MB_LOST.includes(st)&&!!last){a.stage="Lost";return}
 if(st==="negotiations"&&yours){a.stage="Pricing sent";a.pricing=true;return}
 if(/reply/i.test(action)&&reply){a.stage="My reply needed";return}
 if(meet&&meet>=(last||"")&&meet>=(reply||"")){a.stage="Meeting booked";return}
 if(reply){a.stage="In conversation";return}
 a.stage=last?"Generic outreach sent":"Not contacted";
}

async function mbSync(manual){
 if(!Store.mcp||MB.busy)return;const id=String(CFG.mbSales||"").replace(/\D/g,"");if(!id){if(manual)toast("Add your Metabase sales ID in Settings");return}
 MB.busy=true;MB.err="";updMb();
 try{
  const rows=[];let cols=null;
  for(let off=0;off<10000;off+=500){
   const sql=`SELECT c.id, c.domain, c.name, c.deal_status, c.sales_assigned_date, c.last_transferred_date, c.amount_received, c.paid_date, c.expiration_date, c.linkedin, s.industry, s.size, s.location, s.user_count, s.active_users_count, s.credit_30, s.credit_all, s.last_contact_assigned_rep, s.last_reply, s.last_meeting, s.action FROM companies c LEFT JOIN company_statistics s ON s.domain = c.domain WHERE c.sales_id = ${id} ORDER BY c.id LIMIT 500 OFFSET ${off}`;
   const r=await Store.mcp.callTool("Metabase","execute_sql",{database_id:4,sql});
   const data=(r.payload&&r.payload.data)||{};cols=cols||(data.cols||[]).map(c=>c.name);const rs=data.rows||[];rows.push(...rs);if(rs.length<500)break;
  }
  const ix=n=>cols.indexOf(n),get=(r,n)=>{const i=ix(n);return i<0?null:r[i]};
  const byDom=new Map();ACC.forEach(a=>{if(a.domain)byDom.set(a.domain,a)});
  const seen=new Set(),added=[],updated=[];
  rows.forEach(r=>{
   const domain=normDomain(get(r,"domain"));if(!domain)return;seen.add(domain);if(DISMISS["acc:"+domain])return;
   const claimed=mbDate(get(r,"last_transferred_date"))||mbDate(get(r,"sales_assigned_date"))||TODAY;
   const mine=d=>d&&d>=claimed?d:"";   // ignore anything from before the account became yours
   const last=mine(mbDate(get(r,"last_contact_assigned_rep"))),reply=mine(mbDate(get(r,"last_reply"))),meet=mine(mbDate(get(r,"last_meeting")));
   const st=String(get(r,"deal_status")||"").toLowerCase(),action=String(get(r,"action")||"").trim();
   const info={mbId:get(r,"id"),industry:get(r,"industry")||"",size:get(r,"size")||"",location:get(r,"location")||"",users:+get(r,"user_count")||0,activeUsers:+get(r,"active_users_count")||0,credits30:+get(r,"credit_30")||0,creditsAll:+get(r,"credit_all")||0,dashAction:action,dealStatus:st,amount:+get(r,"amount_received")||0,paidDate:mbDate(get(r,"paid_date")),expires:mbDate(get(r,"expiration_date"))};
   let a=byDom.get(domain);
   if(!a){
    const li=String(get(r,"linkedin")||"").trim();
    a={id:uid(),company:String(get(r,"name")||"").trim()||domain,domain,cat:"Metabase",claimed,owned:claimed,log:[],mb:1,...info,li:li?(/^https?:/.test(li)?li:`https://www.linkedin.com/company/${li}`):""};
    if(last){a.first=last;a.last=last}
    if(reply){a.reply=reply;if(!a.first||reply<a.first)a.first=reply}
    if(meet){a.positive=meet;a.meetingDate=meet}
    mbStage(a,{st,last,reply,meet,action,paid:mbDate(get(r,"paid_date")),amount:+get(r,"amount_received")||0,claimed});
    Object.keys(a).forEach(k=>{if(a[k]==="")delete a[k]});
    ACC.push(a);saveAcc(a);added.push(a);return;
   }
   // existing account: refresh dashboard info, move dates forward only, never undo your own stage
   const before=JSON.stringify([a.last,a.reply,a.positive,a.stage]);
   Object.assign(a,info);a.mb=1;if(!a.claimed||a.claimed<claimed&&!a.first){a.claimed=claimed;a.owned=claimed}
   delete a.mbGone;
   if(last&&(!a.last||last>a.last))applyTouch(a,a.channel||"Email","me",last,null,true);
   if(reply&&(!a.reply||reply>a.reply))applyTouch(a,a.channel||"Email","them",reply,null,true);
   if(meet&&(!a.positive||meet>a.positive)){a.positive=meet;if(!a.meetingDate||meet>a.meetingDate)a.meetingDate=meet}
   const fix=(SYNC.mbV||1)<2&&!(a.log||[]).some(l=>!l.auto)&&!(a.calls||[]).length;   // one-time clean-up of stages copied from previous reps
   if(fix){["stage","wonDate","value","pricing","lastCheck","paidBefore"].forEach(k=>delete a[k]);mbStage(a,{st,last:a.last||"",reply:a.reply||"",meet:a.meetingDate||"",action,paid:mbDate(get(r,"paid_date")),amount:+get(r,"amount_received")||0,claimed:a.claimed||claimed})}
   else{const yours=!!last;
    if(MB_WON.includes(st)&&yours&&!["Won"].includes(a.stage)){a.stage="Won";a.wonDate=mbDate(get(r,"paid_date"))||last;if(!a.value&&+get(r,"amount_received"))a.value=+get(r,"amount_received")}
    if(MB_LOST.includes(st)&&yours&&!["Won","Lost"].includes(a.stage))a.stage="Lost";
    a.paidBefore=MB_WON.includes(st)&&!yours?1:undefined;if(!a.paidBefore)delete a.paidBefore;}
   if(JSON.stringify([a.last,a.reply,a.positive,a.stage])!==before)updated.push(a);
   saveAcc(a);
  });
  // accounts that came from Metabase but are no longer under your name
  const gone=ACC.filter(a=>a.mb&&live(a)&&a.domain&&!seen.has(a.domain)&&!a.mbGone);
  gone.forEach(a=>{a.mbGone=TODAY;a.archived=true;saveAcc(a)});
  MB.at=Date.now();SYNC.mbAt=MB.at;SYNC.mbV=2;saveState();buildTasks();render(true);
  if(added.length)popup(`${added.length} new ${added.length===1?"account":"accounts"} from Metabase`,added.slice(0,4).map(a=>a.company).join(", ")+(added.length>4?"…":""),"week",`<button class="btn sm" data-view="pipe">Open Pipeline</button>`);

 MB.busy=false;updMb();
}

function indexAccounts(){const dom=new Map(),em=new Map();ACC.forEach(a=>{if(a.archived||a.assignedTo)return;if(a.email)em.set(a.email.toLowerCase(),a);[a.domain,a.email&&normDomain(a.email)].forEach(d=>{if(d&&!FREE.has(d)&&!dom.has(d))dom.set(d,a)})});return {dom,em}}
function lookup(email,idx){if(!email)return null;if(idx.em.has(email))return idx.em.get(email);const d=email.split("@")[1]||"";if(FREE.has(d))return null;if(idx.dom.has(d))return idx.dom.get(d);const parts=d.split(".");for(let i=1;i<parts.length-1;i++){const p=parts.slice(i).join(".");if(idx.dom.has(p))return idx.dom.get(p)}return null}
function isMine(m){const from=emailOf(m.sender);return (m.labelIds||[]).includes("SENT")||(CFG.gmail&&from===CFG.gmail.toLowerCase())}
function msgAccounts(m,idx){const out=new Set();if(isMine(m)){[...(m.toRecipients||[]),...(m.ccRecipients||[])].forEach(x=>{const a=lookup(emailOf(x),idx);if(a)out.add(a)})}else{const a=lookup(emailOf(m.sender),idx);if(a)out.add(a)}return [...out]}

function parseEvent(ev){
 if(!ev||!ev.start||!ev.start.dateTime||ev.status==="cancelled")return null;
 const self=(ev.attendees||[]).find(x=>x.self);if(self&&self.responseStatus==="declined")return null;
 const st=new Date(ev.start.dateTime),en=new Date((ev.end&&ev.end.dateTime)||ev.start.dateTime);
 const my=(CFG.myDomain||"contactout.io").toLowerCase();
 const ext=(ev.attendees||[]).filter(x=>!x.self&&!x.resource&&x.email&&!x.email.toLowerCase().endsWith("@"+my)&&!/calendar\.google\.com$/.test(x.email));
 const desc=String(ev.description||"").replace(/<br\s*\/?>/gi,"\n").replace(/<[^>]+>/g,"").replace(/&amp;/g,"&");
 const via=/calendly/i.test(desc)?"Calendly":"";
 let domain=((desc.match(/Company Domain:\s*([^\s]+)/i)||[])[1]||"").toLowerCase();domain=normDomain(domain);
 const mail=ext[0]?ext[0].email.toLowerCase():"";if(!domain&&mail&&!FREE.has(mail.split("@")[1]))domain=mail.split("@")[1];
 const qa=[];desc.split("\n").forEach(l=>{const m=l.match(/^(.{6,160}?\?)[^:]*:\s*(.+)$/);if(m&&!/cancel|reschedul/i.test(m[1]))qa.push([m[1].trim(),m[2].trim()])});
 const phone=(desc.match(/Phone Number:\s*([+\d][\d\s()-]{5,})/i)||[])[1]||"";
 let who=(String(ev.summary||"").match(/^(.+?)\s+and\s+/i)||[])[1]||(ext[0]&&ext[0].displayName)||"";
 const idx=indexAccounts();const a=lookup(mail,idx)||(domain?idx.dom.get(domain):null);
 return {id:ev.id,d:S(st),s:st.getHours()+st.getMinutes()/60,e:en.getHours()+en.getMinutes()/60,t:ev.summary||"Meeting",link:ev.htmlLink||"",conf:ev.conferenceUrl||"",ext:ext.length>0,via,domain,mail,qa,phone,who,whoFirst:who.split(" ")[0],company:a?a.company:domain,acc:a?a.id:null};
}
const CAL={err:""};
async function calSync(){
 if(!Store.mcp)return;
 try{const r=await Store.mcp.callTool("Google Calendar","list_events",{startTime:TODAY+"T00:00:00",endTime:add(TODAY,6)+"T23:59:00",pageSize:150,orderBy:"startTime"});
  EVENTS=((r.payload||{}).events||[]).map(parseEvent).filter(Boolean);CAL.err="";
  // a booked call with someone from an account moves it to Meeting (never backwards from Negotiation or Won)
  const moved=[];
  EVENTS.forEach(e=>{if(!e.ext||!e.acc)return;const a=byId(e.acc);if(!a||!live(a))return;
   if(a.meetingDate!==e.d&&(!a.meetingDate||a.meetingDate<TODAY||e.d<a.meetingDate)){a.meetingDate=e.d;a.meetingFrom="calendar";saveAcc(a)}
   if(["Not contacted","Generic outreach sent","No response","Nurture","In sequence","My reply needed","In conversation","Waiting on them"].includes(a.stage)&&!a.pricing){a.prevStage=a.stage;a.stage="Meeting booked";saveAcc(a);moved.push(a)}});
  if(moved.length)popup(moved.length===1?`${moved[0].company} moved to Meeting`:`${moved.length} accounts moved to Meeting`,"Found a call with them in your calendar.","week");
  // remind 2 hours before external meetings
  buildTasks();render(true);
 }catch(e){CAL.err=e&&e.code||"error"}
}

 if(logFor!=null&&!e.target.closest(".ltm")){logFor=null;rerender();}
 const nv=e.target.closest("[data-view]");if(nv){view=nv.dataset.view;layer.innerHTML="";drawerId=null;render();return}
 const ri=e.target.closest("[data-ritual]");if(ri){ritual(ri.dataset.ritual);return}
 const ssb=e.target.closest("[data-ss]");if(ssb){const x=byId(ssb.dataset.ss);x.inSS=!x.inSS;saveAcc(x);rerender();toast(x.inSS?`${x.company} marked as in Sales Sharks`:`${x.company} marked as not in Sales Sharks`);return}
 const sg=e.target.closest("[data-stg]");if(sg){setStage(byId(sg.dataset.id),sg.dataset.stg);return}
 const g=e.target.closest("[data-go]");if(g){pending=g.dataset.go;return}
 const op=e.target.closest("[data-open]");if(op){openAcc(op.dataset.open);return}
 if(e.target.matches("[data-close]")||e.target.closest("button[data-close]")){if(e.target.closest("[data-stop]")&&!e.target.closest("button[data-close]"))return;layer.innerHTML="";drawerId=null;clearInterval(ftimer);ftimer=null;return}
 const b=e.target.closest("[data-act]");if(!b)return;const id=b.dataset.id,a=id?byId(id):null,t=b.dataset.tid?T(b.dataset.tid):null;
 switch(b.dataset.act){
  case "yes":{const snap=[...doneIds()];markAccDone(id);applyTouch(a,pendingCh(a),"me",TODAY);saveAcc(a);confirmFor=null;last=()=>{DONE.ids=snap;saveState()};buildTasks();render();toast(`${a.company} logged. ROE clock reset.`,true);break;}
  case "no":confirmFor=null;render();break;
  case "toggleAuto":openAuto=!openAuto;render();break;
  case "fcold":fCold=!fCold;renderPipe();break;
  case "fmiss":fMissing=!fMissing;renderPipe();break;
  case "fwarn":fWarn=!fWarn;renderPipe();break;
  case "pm":pipeMode=b.dataset.m;renderPipe();break;
  case "custf":custF=b.dataset.k;renderCustomers();break;
  case "custcsv":custCSV(b.dataset.k);break;
  case "pf":pipeFilter=b.dataset.s&&pipeFilter!==b.dataset.s?b.dataset.s:null;renderPipe();break;
  case "tdone":{const m=meta(t);m.done=!t.done;if(m.done&&t.acc&&t.kind!=="prep")markAccDone(t.acc);saveState();buildTasks();render();if(m.done)toast(`Done: ${t.title}`);break;}
  case "tdel2":PTASKS=PTASKS.filter(x=>x.key!==t.key);saveState();buildTasks();renderPlanner();break;
  case "brief":openBrief(Number(b.dataset.ev));break;
  case "tfocus":if(t)startFocus(t.key);break;
  case "focusacc":{const tk=TASKS.find(x=>x.acc===id&&!x.done);if(tk)startFocus(tk.key);else toast("Nothing due for this account");break;}
  case "startfocus":startFocus();break;
  case "hoflag":a.handoff=true;saveAcc(a);layer.innerHTML="";drawerId=null;view="handoff";render();toast(`${a.company} added to Team handoff`);break;
  case "hounflag":delete a.handoff;saveAcc(a);renderHandoff();break;
  case "rxnote":{const h=Team.rx.find(x=>x.id===b.dataset.h);if(h)copy(rxNote(h),"Note copied: post it in the Accounts channel");break;}
  case "hoassign":{const to=hoPick[id];if(!to){toast("Choose a teammate first");break;}b.disabled=true;Team.send(a,to).then(()=>{buildTasks();render();toast(`${a.company} sent to ${Team.name(to)}. It leaves your pipeline once they claim it.`)}).catch(err=>{b.disabled=false;toast(err&&err.code==="invalid_argument"?"Couldn't send: you need Editor access to this page":"Couldn't send, try again")});break;}
  case "houndo":Team.cancel(a).then(()=>{buildTasks();render();toast(`${a.company} is back in your pipeline`)});break;
  case "hoclaim":{const h=Team.rx.find(x=>x.id===b.dataset.h);if(h){b.disabled=true;Team.claim(h).catch(()=>{b.disabled=false;toast("Couldn't claim, try again")})}break;}
  case "hodecline":{const h=Team.rx.find(x=>x.id===b.dataset.h);if(h)Team.decline(h).catch(()=>toast("Couldn't update, try again"));break;}
  case "copycal":copy(CFG.calendly,"Calendly link copied");break;
  case "positive":a.positive=TODAY;if(a.stage==="Not contacted")a.stage="In conversation";saveAcc(a);buildTasks();rerender();toast("Positive interaction logged. ROE-12 resets.");break;
  case "editacc":accForm(a);break;
  case "newacc":accForm(null);break;
  case "saveacc":saveAccForm();break;
  case "delacc":if(delArm!==id){delArm=id;b.innerHTML=`${I.trash}Click again to delete`;break;}deleteAcc(a);layer.innerHTML="";drawerId=null;buildTasks();render();toast(`${a.company} deleted`);break;
  case "rmacc":removeDialog(a);break;
  case "flagsave":saveFlag(a);break;
  case "unflag":delete a.flagged;saveAcc(a);buildTasks();rerender();toast(`${a.company} is back in your pipeline`);break;
  case "mergeacc":{const into=byId(b.dataset.into);mergeInto(a,into);layer.innerHTML="";drawerId=null;buildTasks();render();openAcc(into.id);toast(`${a.company} merged into ${into.company}`);break;}
  case "mergepick":{const v=(document.getElementById("mergein")||{}).value||"";const into=LIVE().find(x=>x.id!==id&&x.company.toLowerCase()===v.trim().toLowerCase());if(!into){toast("Pick an account from the list");break;}mergeInto(a,into);layer.innerHTML="";drawerId=null;buildTasks();render();openAcc(into.id);toast(`${a.company} merged into ${into.company}`);break;}
  case "quicklog":quickLog();break;
  case "logsave":saveLogForm(false);break;
  case "logskip":saveLogForm(true);break;
  case "saveql":saveQuickLog();break;
  case "callnotes":callNotes(id);break;
  case "callsum":callSummarize();break;
  case "callsave":callSave();break;
  case "evacc":{const ev=EVENTS[Number(b.dataset.ev)];accForm(null,{company:ev.company||ev.domain||ev.who,domain:ev.domain,contact:ev.who,email:ev.mail,cat:"Inbound",stage:"Meeting booked",channel:"Email",first:TODAY,last:TODAY,reply:TODAY,positive:TODAY});break;}
  case "addinb":{const x=INBOUNDS.find(z=>z.email===b.dataset.e);const dom=normDomain(x.email);accForm(null,{company:FREE.has(dom)?(x.name||x.email):dom.split(".")[0].replace(/^./,c=>c.toUpperCase()),domain:FREE.has(dom)?"":dom,contact:x.name,email:x.email,cat:"Inbound email",stage:"My reply needed",channel:"Email",first:x.d,reply:x.d});break;}
  case "dismissinb":DISMISS[b.dataset.e]=TODAY;saveState();render();break;
  case "import":importStart();break;
  case "pickfile":document.getElementById("filein").click();break;
  case "readpaste":{const v=document.getElementById("pastein").value;if(!v.trim()){toast("Paste some rows first");break;}IMP.file="Pasted";importRows(parseCSV(v));break;}
  case "doimport":IMP.list=(document.getElementById("implist")||{}).value||IMP.list;doImport();break;
  case "export":exportJSON();break;
  case "exportcsv":exportCSV();break;
  case "restore":document.getElementById("restorein").click();break;
  case "sample":sampleAccounts().forEach(x=>{ACC.push(x);saveAcc(x)});buildTasks();view="today";render();toast("Sample accounts added");break;
  case "clearsample":{const bs=new Set(ACC.filter(x=>x.sample).map(x=>x.b));ACC=ACC.filter(x=>!x.sample);bs.forEach(x=>dirtyB.add(x));sched();buildTasks();render();toast("Sample accounts removed");break;}
  case "gsync":gmailSync(true);break;
  case "mbsync":mbSync(true);break;
  case "testpop":{const was=CFG.popups;CFG.popups=true;popup("This is how alerts look","With a sound if it's turned on.","week");CFG.popups=was;break;}
  case "objp":case "objm":{const o=OBJ[+b.dataset.i];o.n=Math.max(0,o.n+(b.dataset.act==="objp"?1:-1));saveState();nav();ritual("wplan");break;}
  case "objd":OBJ.splice(+b.dataset.i,1);saveState();nav();ritual("wplan");break;
  case "sdone":{const w=document.getElementById("win").value.trim(),nx=planDays()[1];document.querySelectorAll("[data-roll]").forEach(c=>{if(c.checked){const x=T(c.dataset.roll);if(x){const m=meta(x);m.date=nx;m.time=null}}});if(w)HIGHLIGHTS.unshift({d:TODAY,t:w});saveState();buildTasks();layer.innerHTML="";render();toast(w?"Shut down. Highlight saved.":"Shut down. See you tomorrow.");break;}
  case "fplay":if(ftimer){clearInterval(ftimer);ftimer=null;b.innerHTML=I.play+"Resume";}else{b.innerHTML=I.pause+"Pause";ftimer=setInterval(()=>{fleft=Math.max(0,fleft-1);const el=document.getElementById("ftime");if(!el){clearInterval(ftimer);ftimer=null;return}el.textContent=mm(fleft);document.getElementById("fbar").style.width=(fleft/ftotal*100)+"%";if(!fleft){clearInterval(ftimer);ftimer=null;popup("Time's up",fqueue[0]?fqueue[0].title:"","today")}},1000);}break;
  case "fdone":{const x=fqueue.shift();const m=meta(x);m.done=true;if(x.acc&&x.kind!=="prep")markAccDone(x.acc);saveState();clearInterval(ftimer);ftimer=null;buildTasks();if(fqueue.length){fqueue=fqueue.map(q=>T(q.key)||q);focusShow();toast(`Done: ${x.title}`)}else{layer.innerHTML="";render();toast("All of today's tasks are done")}break;}
  case "fexit":clearInterval(ftimer);ftimer=null;layer.innerHTML="";render();break;
 }
});
function setStage(a,col){
 if(!a)return;const snap=JSON.stringify(a);
 if(col==="Engaged"){a.stage="In conversation";if(!a.positive)a.positive=TODAY}
 if(col==="Meeting"){a.stage="Meeting booked";if(!a.meetingDate)a.meetingDate=TODAY}
 if(col==="Negotiation"){a.stage="Pricing sent";a.pricing=true}
 if(col==="Closed won"){a.stage="Won";a.wonDate=TODAY}
 if(col==="Closed lost"){a.stage="Lost"}
 a.stageSince=TODAY;
 last=()=>{const o=JSON.parse(snap);Object.keys(a).forEach(k=>delete a[k]);Object.assign(a,o);saveAcc(a);buildTasks()};
 saveAcc(a);buildTasks();rerender();toast(`${a.company} moved to ${col}`,true);
}
function pendingCh(a){const p=plan(a);return p.go?(p.go.kind==="lemlist"?"lemlist":p.go.kind):"Email"}
function copy(text,ok){try{navigator.clipboard.writeText(text).then(()=>toast(ok),()=>toast(text))}catch(err){toast(text)}}
document.addEventListener("change",e=>{
 const el=e.target;
 if(el.dataset.hopick){hoPick[el.dataset.hopick]=el.value;return}
 if(el.dataset.imap){IMP.map[el.dataset.imap]=el.value===""?null:Number(el.value);IMP.list=(document.getElementById("implist")||{}).value||IMP.list;importMap();return}
 if(el.dataset.cfg){const k=el.dataset.cfg;let v=el.type==="checkbox"?el.checked:el.value;if(el.type==="number"){v=Math.max(1,Number(v)||DEF[k])}if(k==="myDomain")v=normDomain(v);CFG[k]=v;saveState();buildTasks();nav();if(k==="sync"&&v)gmailSync(false);toast("Saved");return}
 if(el.id==="filein"&&el.files[0]){readFile(el.files[0]);el.value="";return}
 if(el.id==="restorein"&&el.files[0]){restoreFile(el.files[0]);el.value="";return}
 const s=el.dataset.sub;if(s){const [k,i]=s.split("|");const t=T(k);if(t){const m=meta(t);m.subs=(m.subs||t.subs).map((x,j)=>j==+i?{...x,d:el.checked}:x);saveState()}}
});
document.addEventListener("input",e=>{if(e.target.id==="q"){query=e.target.value;renderFind()}if(e.target.id==="pq"){pq=e.target.value;renderPipe();const x=document.getElementById("pq");x.focus();x.setSelectionRange(x.value.length,x.value.length)}});
document.addEventListener("submit",e=>{e.preventDefault();const f=e.target;
 if(f.id==="accform"){saveAccForm();return}
 if(f.id==="qlform"){saveQuickLog();return}
 if(f.id==="logform"){saveLogForm(false);return}
 if(f.id==="flagform"){const btn=document.querySelector('[data-act="flagsave"]');if(btn)saveFlag(byId(btn.dataset.id));return}
 if(f.dataset.add){const inp=f.querySelector("input"),v=inp.value.trim();if(!v)return;PTASKS.push({key:uid("p"),acc:null,title:v,sub:"",est:15,tag:"admin",src:"",date:f.dataset.add,time:null,lane:"today",subs:[],done:false});saveState();buildTasks();renderPlanner();document.getElementById("add-"+f.dataset.add).focus();return}
 if(f.id==="objform"){const v=document.getElementById("objin").value.trim(),of=Math.max(1,+document.getElementById("objof").value||5);if(v){OBJ.push({t:v,n:0,of});saveState();nav();ritual("wplan")}}
});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&(logFor!=null||emFor!=null)){logFor=null;emFor=null;rerender();return}if(e.key==="Escape"&&layer.innerHTML){layer.innerHTML="";drawerId=null;clearInterval(ftimer);ftimer=null}
 if(e.key==="Enter"&&e.target.classList&&e.target.classList.contains("dcard")){openAcc(e.target.dataset.open)}});
let dragT=null;
document.addEventListener("dragstart",e=>{const t=e.target.closest&&e.target.closest(".task[data-tid]");if(t){dragT=t.dataset.tid;t.classList.add("dragging");e.dataTransfer.effectAllowed="move"}});
document.addEventListener("dragend",()=>{dragT=null;document.querySelectorAll(".over").forEach(x=>x.classList.remove("over"))});
document.addEventListener("dragover",e=>{if(dragT==null)return;const z=e.target.closest(".drop");if(z){e.preventDefault();document.querySelectorAll(".over").forEach(x=>x!==z&&x.classList.remove("over"));z.classList.add("over")}});
document.addEventListener("drop",e=>{if(dragT==null)return;const t=T(dragT),d=e.target.closest(".drop");e.preventDefault();
 if(t&&d){const m=meta(t);m.date=d.dataset.day;m.time=null;saveState();buildTasks();toast(`${t.title} moved to ${d.dataset.day===TODAY?"today":wd(d.dataset.day)}`)}
 dragT=null;renderPlanner()});
function back(){if(pending!==null&&document.visibilityState==="visible"){const a=byId(pending);pending=null;if(a&&view==="today"){confirmFor=a.id;renderToday()}}}
document.addEventListener("visibilitychange",back);window.addEventListener("focus",back);
(function(){const root=document.documentElement;const set=m=>{if(m==="dark")root.setAttribute("data-mode","dark");else root.removeAttribute("data-mode");try{localStorage.setItem("myday-mode",m)}catch(e){}};
 let m="light";try{m=localStorage.getItem("myday-mode")||"light"}catch(e){}set(m);
 document.getElementById("mode").addEventListener("click",()=>set(root.getAttribute("data-mode")==="dark"?"light":"dark"));})();

const clone=x=>JSON.parse(JSON.stringify(x));
async function init(){
 try{await Store.init()}catch(e){}
 let data={buckets:{},state:null};
 try{data=await Store.load()}catch(e){main.innerHTML=`<div class="wbody"><div class="hero"><h2>Couldn't load your accounts</h2><p>${e&&e.code==="unavailable"?"Claude's storage is briefly unavailable. Reload in a moment.":"Reload the page. If it keeps happening, check you were invited to this page as Editor."}</p></div></div>`;return}
 Object.entries(data.buckets||{}).forEach(([b,list])=>(list||[]).forEach(x=>{const a=clone(x);a.b=b;ACC.push(a)}));
 const st=data.state?clone(data.state):{};
 CFG={...DEF,...(st.cfg||{})};PTASKS=st.ptasks||[];TMETA=st.tmeta||{};OBJ=st.obj||[];HIGHLIGHTS=st.hl||[];DONE=st.done||{d:TODAY,ids:[]};SYNC=st.sync||{};NOTI=st.noti||{};SEEN=st.seen||{};DISMISS=st.dismiss||{};
 PTASKS.forEach(p=>{if(!p.done&&p.date<TODAY)p.date=TODAY});PTASKS=PTASKS.filter(p=>!(p.done&&p.date<add(TODAY,-14)));
 Object.keys(TMETA).forEach(k=>{const d=(k.match(/\d{4}-\d{2}-\d{2}/)||[])[0];if(d&&d<add(TODAY,-14))delete TMETA[k]});
 loaded=true;buildTasks();render();
 purgeDeleted();watchMine();
 Team.start();
 if(Store.mcp){calSync();(CFG.mbSync?mbSync(false):Promise.resolve()).then(()=>{if(CFG.sync)gmailSync(false)})}
 setInterval(()=>{if(CFG.mbSync)mbSync(false)},60*60000);
 setInterval(tick,60000);setTimeout(tick,4000);
 setInterval(()=>{if(CFG.sync)gmailSync(false)},15*60000);
 setInterval(calSync,30*60000);
}
init();
})();
